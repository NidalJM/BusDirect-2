<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect — Safi ➔ Marrakech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-black': '#000000',
                        'brand-canvas': '#ffffff',
                        'brand-soft': '#efefef',
                        'brand-softer': '#f3f3f3',
                        'brand-body': '#5e5e5e',
                        'brand-border': '#e2e2e2'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-brand-canvas text-brand-black antialiased font-sans min-h-screen">
    <header
        class="sticky top-0 z-50 bg-white border-b border-brand-border px-4 sm:py-6 py-3 flex flex-wrap justify-between items-center gap-2 sm:gap-4">
        <div class="flex items-center gap-3">
            <span class="text-lg sm:text-xl font-bold tracking-tight">BusDirect</span>

        </div>
        <div>
            <span
                class="flex bg-brand-soft px-3 sm:px-4 py-1 sm:py-1.5 rounded-full text-sm font-medium items-center justify-center">Temp
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-3 sm:p-6 grid gap-4 sm:gap-8">
        <section class="lg:col-span-7 flex flex-col gap-6">
            <div class="flex justify-between bg-white rounded-2xl border border-brand-border p-4 sm:p-6 shadow-sm">
                <form action="/search" method="get">
                    
                        <label for="site-search">Search:</label>
                        <input type="search" id="site-search" name="q" placeholder="Search routes, cities ..."
                            class="border rounded-md py-1 pl-2.5" required>
                        <!-- <button type="submit" class="">Search</button> -->
                </form>        
                        <div><button id="btn-prev" type="button"
                            class="px-3 py-1.5 rounded-lg bg-brand-soft text-brand-black hover:bg-brand-border transition-all text-sm font-medium">Prev</button>
                        <span id="page-info" class="text-sm font-medium px-2">Page # sur #</span>
                        <button id="btn-next" type="button"
                            class="px-3 py-1.5 rounded-lg bg-brand-soft text-brand-black hover:bg-brand-border transition-all text-sm font-medium">Next</button>
                        </div>
                
            </div>
            <div class="bg-white rounded-2xl border border-brand-border p4 sm:p-6 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold p-3">Les Trajets disponible</h2>
                    <div class="flex items-center gap-2 text-xs font-medium p-3">
                        </span>
                    </div>
                </div>

                <div class="bg-brand-soft rounded-xl p-4">
                    <div
                        class="text-center text-xs font-semibold text-brand-body uppercase tracking-wider mb-4 pb-2 border-b border-brand-border">
                        Trajet 1
                    </div>
                    <div
                        class="text-center text-xs font-semibold text-brand-body uppercase tracking-wider mb-4 pb-2 border-b border-brand-border">
                        Trajet 2
                    </div>
                    <div
                        class="text-center text-xs font-semibold text-brand-body uppercase tracking-wider mb-4 pb-2 border-b border-brand-border">
                        Trajet 3
                    </div>
                    <div
                        class="text-center text-xs font-semibold text-brand-body uppercase tracking-wider mb-4 pb-2 border-b border-brand-border">
                        Trajet 4
                    </div>
                    <div
                        class="text-center text-xs font-semibold text-brand-body uppercase tracking-wider mb-4 pb-2 border-b border-brand-border">
                        Trajet 5
                    </div>
                    <div
                        class="text-center text-xs font-semibold text-brand-body uppercase tracking-wider mb-4 pb-2 border-b border-brand-border">
                        Trajet 6
                    </div>

                </div>
            </div>
            </div>
    </main>
</body>

</html>
